name: Sync ISP lists

# Refreshes the Iranian ISP address lists in data/isp:
#   upstream/  Kiya6955/IR-ISP-Blocker lists
#   asn/       IPv4 prefixes announced by each ISP's AS (asn.map), from RIPEstat
# then merges them (tools/merge-isp.sh), rebuilds dist/ with the lists embedded
# and commits only when something changed. Servers pick the new data up with
# `st isp update` (from data/isp) or with a normal `st --update` (embedded).

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch upstream lists
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/Kiya6955/IR-ISP-Blocker/main'
          for pair in mci:mci mtn:mtn tci:tci rightel:rightel shatel:shatel asiatech:asiatech pishgaman:pishgaman mobinnet:mobinnet parsonline:parsan; do
            id="${pair%%:*}"; stem="${pair##*:}"
            curl -fsSL "${base}/${stem}-ips.ipv4" | tr -d '\r' \
              | awk '/^([0-9]{1,3}\.){3}[0-9]{1,3}(\/([0-9]|[12][0-9]|3[0-2]))?$/' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | uniq > "/tmp/${id}.up"
            # Refuse an empty or implausibly small download. A big drop in the
            # NUMBER of ranges is fine: upstream aggregates its lists.
            old="$(wc -l < "data/isp/upstream/${id}.ipv4")"
            new="$(wc -l < "/tmp/${id}.up")"
            if [ "$new" -lt 10 ]; then
              echo "::warning::${id}: only ${new} ranges (was ${old}) — keeping the current list."
              continue
            fi
            cp "/tmp/${id}.up" "data/isp/upstream/${id}.ipv4"
          done

      - name: Fetch announced prefixes of each ISP's AS
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' data/isp/asn.map | while read -r id asn; do
            curl -fsSL "https://stat.ripe.net/data/announced-prefixes/data.json?resource=${asn}" \
              | grep -oE '"prefix": *"[0-9.]+/[0-9]+"' | grep -oE '[0-9.]+/[0-9]+' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | uniq > "/tmp/${id}.asn"
            old="$(wc -l < "data/isp/asn/${id}.ipv4" 2>/dev/null || echo 0)"
            new="$(wc -l < "/tmp/${id}.asn")"
            if [ "$new" -lt 5 ] || [ "$new" -lt $((old / 2)) ]; then
              echo "::warning::${id} (${asn}): ${new} prefixes (was ${old}) — keeping the current list."
              continue
            fi
            cp "/tmp/${id}.asn" "data/isp/asn/${id}.ipv4"
          done

      - name: Merge, rebuild and commit if changed
        run: |
          set -euo pipefail
          bash tools/merge-isp.sh
          if git diff --quiet -- data/isp; then
            echo "Lists unchanged."
            exit 0
          fi
          bash build.sh
          bash tests/smoke.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/isp dist/server-tools.sh
          git commit -m "chore(data): sync Iranian ISP lists"
          git push
